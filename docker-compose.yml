version: '3.8'

services:
  backend:
    build:
      context: .
    container_name: backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://admin:admin@db:5432/readydiceroll
    depends_on:
      - db
    volumes:
      - ./:/app
    working_dir: /app
    command: npm run start:dev

  db:
    image: postgres:16-alpine
    container_name: postgres-dev
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: readydiceroll
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init/db_init.sql:/docker-entrypoint-initdb.d/db_init.sql:ro

volumes:
  pgdata:
